<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yeni Sekme</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://sigal-ex.vercel.app">
  <link rel="dns-prefetch" href="https://sigal-ex.vercel.app">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #app-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      outline: 0;
      display: block;
      background-color: #ffffff;
      z-index: 1;
    }
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      z-index: 10;
      pointer-events: none;
      background: linear-gradient(90deg, #1a73e8, #4285f4, #669df6);
      background-size: 200% 100%;
      animation: loading 1.2s infinite linear;
      transition: opacity 0.25s ease-out;
    }
    @keyframes loading {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }
    #error-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 5;
    }
    #error-container.active {
      display: flex;
    }
    .btn {
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
      background: #1a73e8;
      color: #ffffff;
    }
    .btn:hover {
      background: #1557b0;
    }
  </style>
</head>
<body>
  <div id="loader"></div>
  <iframe
    id="app-frame"
    src="https://sigal-ex.vercel.app"
    allow="accelerometer; autoplay; clipboard-write; clipboard-read; encrypted-media; gyroscope; picture-in-picture; web-share; camera; microphone; geolocation"
    sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts allow-top-navigation allow-downloads"
  ></iframe>

  <div id="error-container">
    <button id="retry-btn" class="btn">Yeniden Dene</button>
  </div>

  <script src="newtab.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yeni Sekme</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #07080b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #app-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      outline: 0;
      display: block;
      background-color: #07080b;
      z-index: 1;
    }
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      z-index: 10;
      pointer-events: none;
      background: linear-gradient(90deg, #6366f1, #06b6d4, #10b981);
      background-size: 200% 100%;
      animation: loading 1.2s infinite linear;
      transition: opacity 0.25s ease-out;
    }
    @keyframes loading {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }
    #settings-trigger {
      position: fixed;
      bottom: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(15, 17, 26, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.15;
      transition: all 0.2s ease;
      z-index: 20;
    }
    #settings-trigger:hover {
      opacity: 0.95;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(20, 24, 38, 0.85);
      transform: scale(1.05);
    }
    #settings-trigger svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
    #modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30;
    }
    #modal-overlay.active {
      display: flex;
    }
    .modal-card {
      width: 440px;
      max-width: 90%;
      background: #11131c;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .modal-title {
      font-size: 15px;
      font-weight: 600;
      color: #f8fafc;
    }
    .modal-close {
      background: transparent;
      border: 0;
      color: #64748b;
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      line-height: 1;
    }
    .modal-close:hover {
      color: #f8fafc;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      color: #ffffff;
      background: #090a0f;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .form-input:focus {
      border-color: #6366f1;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }
    .btn-primary {
      background: #4f46e5;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #4338ca;
    }
    #error-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 5;
    }
    #error-container.active {
      display: flex;
    }
  </style>
</head>
<body>
  <div id="loader"></div>
  <iframe
    id="app-frame"
    allow="accelerometer; autoplay; clipboard-write; clipboard-read; encrypted-media; gyroscope; picture-in-picture; web-share; camera; microphone; geolocation"
    sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts allow-top-navigation allow-downloads"
  ></iframe>

  <div id="error-container">
    <button id="retry-btn" class="btn btn-primary">Yeniden Dene</button>
  </div>

  <button id="settings-trigger" aria-label="Ayarlar">
    <svg viewBox="0 0 24 24">
      <path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97 0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1 0 .33.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66Z"/>
    </svg>
  </button>

  <div id="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title">Web Sitesi Ayarı</span>
        <button id="modal-close-btn" class="modal-close">&times;</button>
      </div>
      <div class="form-group">
        <label for="url-input" class="form-label">Site URL</label>
        <input type="url" id="url-input" class="form-input" placeholder="https://..." autocomplete="off" spellcheck="false">
      </div>
      <div class="modal-actions">
        <button id="reset-default-btn" class="btn btn-secondary">Varsayılan</button>
        <button id="save-btn" class="btn btn-primary">Kaydet</button>
      </div>
    </div>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
